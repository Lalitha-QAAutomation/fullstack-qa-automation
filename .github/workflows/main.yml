
name: Fullstack QA Automation CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_qa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d employee_qa_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: employee_qa_db
      PGUSER: postgres
      PGPASSWORD: postgres
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize database schema
        run: psql -f db/schema.sql

      - name: Start Express API
        run: |
          node app/server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run all automated tests
        run: |
          mkdir -p test-results
          npm run test:report

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: test-results/results.xml
          if-no-files-found: warn

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: express-server-logs
          path: server.log
          if-no-files-found: ignore

